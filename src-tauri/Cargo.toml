[package]
name = "diskscope"
version = "0.1.0"
description = "See what is eating your disk, and understand why."
authors = ["diskscope contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "diskscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
